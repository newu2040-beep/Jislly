name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          
          JAVA_MAJOR_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{if ($1 == "1") {print $2} else {print $1}}')
          echo "Detected Java major version: $JAVA_MAJOR_VERSION"
          
          if [ -z "$JAVA_MAJOR_VERSION" ]; then
            echo "Error: Unable to detect Java major version."
            exit 1
          fi
          
          if [ "$JAVA_MAJOR_VERSION" -lt 17 ]; then
            echo "Error: Java 17 or newer is required, but detected version $JAVA_MAJOR_VERSION."
            exit 1
          fi
          
          echo "Java environment verified successfully (Java $JAVA_MAJOR_VERSION >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "=== Checking Temporary Debug Keystore ==="
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug.keystore using Java keytool..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create ./debug.keystore."
            exit 1
          fi
          echo "Temporary debug keystore is ready."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        id: verify_apk
        run: |
          echo "=== Verifying Debug APK Output ==="
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected APK not found at $EXPECTED_APK"
            echo "Searching inside app/build/outputs/apk:"
            find app/build/outputs/apk -maxdepth 3 -name "*.apk" || true
            exit 1
          fi
          
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: APK file at $EXPECTED_APK is empty."
            exit 1
          fi
          
          echo "Verified APK exists and is non-empty at: $EXPECTED_APK"
          APK_SIZE=$(stat -c%s "$EXPECTED_APK" 2>/dev/null || stat -f%z "$EXPECTED_APK" 2>/dev/null || wc -c < "$EXPECTED_APK")
          echo "APK size: $APK_SIZE bytes"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          echo "=== Preparing APK Release Asset ==="
          REPO_RAW="${{ github.event.repository.name }}"
          if [ -z "$REPO_RAW" ]; then
            REPO_RAW="app"
          fi
          # Sanitize repo name to safe characters (alphanumeric, dashes)
          REPO_SAFE=$(echo "$REPO_RAW" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_-]/-/g')
          
          RUN_NUM="${{ github.run_number }}"
          RELEASE_ASSET_NAME="${REPO_SAFE}-debug-build-${RUN_NUM}.apk"
          
          TMP_DIR=$(mktemp -d -t apk-release-XXXXXX)
          RELEASE_ASSET_PATH="${TMP_DIR}/${RELEASE_ASSET_NAME}"
          
          cp "app/build/outputs/apk/debug/app-debug.apk" "$RELEASE_ASSET_PATH"
          
          if [ ! -f "$RELEASE_ASSET_PATH" ] || [ ! -s "$RELEASE_ASSET_PATH" ]; then
            echo "Error: Failed to prepare release asset at $RELEASE_ASSET_PATH"
            exit 1
          fi
          
          echo "Prepared release asset: $RELEASE_ASSET_PATH"
          echo "Asset filename: $RELEASE_ASSET_NAME"
          echo "asset_path=${RELEASE_ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${RELEASE_ASSET_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Publishing to GitHub Releases ==="
          gh --version
          
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset is missing or empty at $ASSET_PATH."
            exit 1
          fi
          
          RELEASE_NOTES=$(cat <<EOF
          ### 📱 Automated Debug APK Build #${{ github.run_number }}
          
          - **Build System**: GitHub Actions
          - **Run Number**: ${{ github.run_number }}
          - **Run Attempt**: ${{ github.run_attempt }}
          - **Source Commit**: ${{ github.sha }}
          - **Asset Filename**: \`${ASSET_NAME}\`
          
          > ⚠️ **Notice**: This is an automatically generated debug build intended for testing and development. It is signed with a temporary debug keystore and is not a Play Store production release.
          EOF
          )
          
          echo "Creating GitHub Release with tag: $RELEASE_TAG and latest flag..."
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Summary & Download Report ==="
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "GitHub Release publication succeeded!"
            gh release view "$RELEASE_TAG" || true
            
            REPO_URL="${{ github.server_url }}/${{ github.repository }}"
            RELEASE_URL="${REPO_URL}/releases/tag/${RELEASE_TAG}"
            
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "Asset Filename: $ASSET_NAME"
            
            echo "### 🚀 Debug APK Build Succeeded!" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK has been built and published directly to GitHub Releases:" >> "$GITHUB_STEP_SUMMARY"
            echo "- 📦 **Direct Download**: [Download ${ASSET_NAME} from GitHub Release](${RELEASE_URL})" >> "$GITHUB_STEP_SUMMARY"
            echo "- 🏷️ **Release Tag**: \`${RELEASE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- 📑 **Release Title**: ${RELEASE_TITLE}" >> "$GITHUB_STEP_SUMMARY"
            echo "- 🗄️ **Backup Artifact**: The APK is also preserved as a workflow artifact named \`app-debug-apk\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing was not completed or encountered an issue. The workflow artifact remains available."
            echo "### ⚠️ Debug APK Built (Artifact Available)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK was built successfully and is preserved as a workflow artifact:" >> "$GITHUB_STEP_SUMMARY"
            echo "- 📦 **Workflow Artifact**: \`app-debug-apk\` (available for download in the Summary tab of this Actions run)" >> "$GITHUB_STEP_SUMMARY"
            echo "- ℹ️ *GitHub Release publishing encountered a warning or was skipped, but your APK build was not lost.*" >> "$GITHUB_STEP_SUMMARY"
          fi
